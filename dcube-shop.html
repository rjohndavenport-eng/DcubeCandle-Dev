<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Collection — DCube Candle Co.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500;600&family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="assets/js/includes.js" defer></script>
</head>
<body class="template-shop">
    <div data-include="components/common/announcement.html"></div>
    <div data-include="components/common/header.html"></div>

    <main>
        <div data-include="components/sections/page-hero.html" data-modifier="page-hero--shop" data-title="Our Collection" data-subtitle="Hand-poured candles to illuminate your life"></div>

        <div class="filter-bar">
            <div class="filter-group">
                <select>
                    <option>Filter by Scent</option>
                    <option>Floral</option>
                    <option>Woody</option>
                    <option>Fresh</option>
                    <option>Sweet</option>
                </select>
            </div>
            <select>
                <option>Sort by</option>
                <option>Price: Low to High</option>
                <option>Price: High to Low</option>
                <option>Newest</option>
                <option>Best Selling</option>
            </select>
        </div>

        <section class="shop-section">
            <div class="product-grid">
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Lavender Dreams" data-name="Lavender Dreams" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Vanilla Warmth" data-name="Vanilla Warmth" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Cedarwood Peace" data-name="Cedarwood Peace" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Honey Glow" data-name="Honey Glow" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Rose Garden" data-name="Rose Garden" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Coastal Breeze" data-name="Coastal Breeze" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Amber Night" data-name="Amber Night" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Eucalyptus Mist" data-name="Eucalyptus Mist" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Cinnamon Spice" data-name="Cinnamon Spice" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Garden Sage" data-name="Garden Sage" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Wild Fig" data-name="Wild Fig" data-price="$28.00"></div>
                <div data-include="components/cards/product-card-quickadd.html" data-image-label="Palo Santo" data-name="Palo Santo" data-price="$28.00"></div>
            </div>

            <div class="load-more">
                <button class="btn">Load More Products</button>
            </div>
        </section>
    </main>

    <div data-include="components/common/footer.html"></div>
</body>
</html>
